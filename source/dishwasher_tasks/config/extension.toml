[[python.module]]
name = "dishwasher_tasks"

# UI extension module: Kit imports this submodule directly and scans it for ``omni.ext.IExt``
# subclasses. Kept separate from the package root so ``import dishwasher_tasks`` stays omni-free headless.
[[python.module]]
name = "dishwasher_tasks.ui_extension_example"

